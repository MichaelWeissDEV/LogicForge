plugins {
    // Lets Gradle auto-download a matching JDK when the required toolchain (Java 25) isn't
    // installed/registered locally, instead of failing with "Toolchain download repositories
    // have not been configured" — the error VS Code's Gradle plugin hits when it can't find
    // JDK 25 on PATH.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'logicforge'

include 'logic-core'
include 'circuit-model'
include 'simulation-core'
include 'logic-analyzer'
include 'component-library'
include 'component-structures'
include 'circuit-compiler'
include 'project-format'
include 'processor-lf8'
include 'processor-lf8-runtime'
include 'lf8-tools'
include 'ui'
include 'app'
