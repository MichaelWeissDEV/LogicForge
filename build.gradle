plugins {
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0' apply false
}

allprojects {
    group = 'dev.logicforge'
    // Set once, in gradle.properties.
    version = rootProject.property('version')
}

subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:all' << '-Xlint:-serial' << '-Xlint:-this-escape'
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
        testLogging {
            events 'failed'
            exceptionFormat 'full'
        }
    }
}

tasks.register('verifyExamples') {
    group = 'verification'
    description = 'Verifies committed generated examples are current'
    dependsOn ':app:verifyExamples'
}
