plugins {
    id 'java-library'
    id 'org.openjfx.javafxplugin'
}

dependencies {
    api project(':circuit-model')
    api project(':component-library')
    api project(':circuit-compiler')
    api project(':simulation-core')
    api project(':project-format')
}

javafx {
    version = '25.0.1'
    modules = ['javafx.controls', 'javafx.graphics']
}
