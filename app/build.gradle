plugins {
    id 'java-library'
    id 'application'
    id 'org.openjfx.javafxplugin'
}

dependencies {
    implementation project(':ui')
}

javafx {
    version = '25.0.1'
    // javafx.swing is only used by the development tools below.
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.swing']
}

application {
    mainClass = 'dev.logicforge.app.LogicForgeApp'
    // JavaFX loads its own native libraries; granting native access keeps start-up quiet.
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

/*
 * Development tools that drive the real workbench (rendering a picture of it, replaying
 * interactions). They are not part of the application and not unit tests, so they live in
 * their own source set and never end up in the distribution.
 */
sourceSets {
    tools {
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

tasks.register('screenshot', JavaExec) {
    group = 'verification'
    description = 'Renders the workbench with a demo circuit into build/screenshot.png'
    dependsOn tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.logicforge.app.WorkbenchScreenshot'
    args = [project.findProperty('out') ?: "${layout.buildDirectory.get()}/screenshot.png"]
}

tasks.register('uiCheck', JavaExec) {
    group = 'verification'
    description = 'Replays canvas gestures against the real UI and reports the outcome'
    dependsOn tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.logicforge.app.CanvasInteractionCheck'
}

tasks.register('examples', JavaExec) {
    group = 'build'
    description = 'Regenerates the example circuits in examples/ through the real save path'
    dependsOn tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.logicforge.app.ExampleGenerator'
    args = [rootProject.file('examples').absolutePath]
}
