plugins {
    id 'java-library'
    id 'application'
    id 'org.openjfx.javafxplugin'
}

dependencies {
    implementation project(':ui')
}

javafx {
    version = '25.0.1'
    // javafx.swing is only used by the development tools below.
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.swing']
}

application {
    applicationName = 'logicforge'
    mainClass = 'dev.logicforge.app.Main'
    // JavaFX loads its own native libraries; granting native access keeps start-up quiet.
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

tasks.named('processResources') {
    from(rootProject.file('examples')) {
        into 'examples'
    }
}

/*
 * Development tools that drive the real workbench (rendering a picture of it, replaying
 * interactions). They are not part of the application and not unit tests, so they live in
 * their own source set and never end up in the distribution.
 */
sourceSets {
    tools {
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

dependencies {
    toolsImplementation project(':component-structures')
    toolsImplementation project(':processor-lf8')
}

tasks.register('screenshot', JavaExec) {
    group = 'verification'
    description = 'Renders the workbench with a demo circuit into build/screenshot.png'
    dependsOn tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.logicforge.app.WorkbenchScreenshot'
    args = [project.findProperty('out') ?: "${layout.buildDirectory.get()}/screenshot.png"]
}

tasks.register('uiCheck', JavaExec) {
    group = 'verification'
    description = 'Replays canvas gestures against the real UI and reports the outcome'
    dependsOn tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.logicforge.app.CanvasInteractionCheck'
}

tasks.register('examples', JavaExec) {
    group = 'build'
    description = 'Regenerates the example circuits in examples/ through the real save path'
    dependsOn tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.logicforge.app.ExampleGenerator'
    args = [rootProject.file('examples').absolutePath]
}

def verificationExamples = layout.buildDirectory.dir('generated/verify-examples')

tasks.register('generateExamplesForVerification', JavaExec) {
    group = 'verification'
    description = 'Generates examples into an isolated build directory'
    dependsOn tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.logicforge.app.ExampleGenerator'
    args = [verificationExamples.get().asFile.absolutePath]
    doFirst {
        delete verificationExamples
    }
}

tasks.register('verifyExamples') {
    group = 'verification'
    description = 'Fails when committed generated .logic examples are stale'
    dependsOn tasks.named('generateExamplesForVerification')
    doLast {
        def generatedRoot = verificationExamples.get().asFile.toPath()
        def committedRoot = rootProject.file('examples').toPath()
        def uuidPattern = java.util.regex.Pattern.compile(
                '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}')
        def canonical = { String source ->
            def ids = new LinkedHashMap<String, String>()
            def matcher = uuidPattern.matcher(source)
            def result = new StringBuffer()
            while (matcher.find()) {
                def replacement = ids.computeIfAbsent(matcher.group()) {
                    String.format('00000000-0000-0000-0000-%012d', ids.size() + 1)
                }
                matcher.appendReplacement(result, replacement)
            }
            matcher.appendTail(result)
            result.toString()
        }
        def stale = []
        java.nio.file.Files.walk(generatedRoot).withCloseable { paths ->
            paths.filter { java.nio.file.Files.isRegularFile(it) && it.toString().endsWith('.logic') }
                    .sorted().forEach { generated ->
                def relative = generatedRoot.relativize(generated)
                def committed = committedRoot.resolve(relative)
                if (!java.nio.file.Files.exists(committed)
                        || canonical(java.nio.file.Files.readString(generated))
                        != canonical(java.nio.file.Files.readString(committed))) {
                    stale.add(relative.toString())
                }
            }
        }
        if (!stale.isEmpty()) {
            throw new GradleException('Generated examples are stale: ' + stale.join(', ')
                    + '. Run ./gradlew :app:examples and commit the results.')
        }
    }
}

// Self-contained Linux packages: packageLinuxImage, packageDeb, verifyDeb, packageSnap.
apply from: rootProject.file('gradle/linux-packaging.gradle')

tasks.named('test') {
    // DesktopIntegrationFilesTest checks packaging/linux against the code.
    systemProperty 'logicforge.packaging', rootProject.file('packaging/linux').absolutePath
}
